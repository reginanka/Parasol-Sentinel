name: Weather Check

on:
  workflow_dispatch: # Manual trigger only — scheduling is handled by cron-job.org

jobs:
  weather_check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-check endpoint
        run: |
          curl -f -X GET "https://${{ secrets.DOMAIN }}/api/cron-check" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
