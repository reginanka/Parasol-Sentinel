name: Weather Check

on:
  schedule:
    # Run at 02:02 and 07:02 UTC (05:02 and 10:02 Kyiv time)
    - cron: '2 02,7 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  weather_check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-check endpoint
        run: |
          curl -f -X GET "https://${{ secrets.DOMAIN }}/api/cron-check" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
