name: Daily Forecast

on:
  workflow_dispatch: # Manual trigger only — scheduling is handled by cron-job.org

jobs:
  daily_forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-forecast endpoint
        run: |
          curl -f -X GET "https://${{ secrets.DOMAIN }}/api/cron-forecast" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
